<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#08090e">
    <title>PerkDrop</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #08090e;
        color: #fff;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 22px;
        background:
          radial-gradient(circle at 75% 18%, rgba(255, 77, 184, .18), transparent 32%),
          radial-gradient(circle at 12% 82%, rgba(108, 59, 255, .18), transparent 34%),
          #08090e;
      }
      main {
        width: min(430px, 100%);
        text-align: center;
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 24px;
        box-shadow: 0 18px 55px rgba(0, 0, 0, .4);
      }
      h1 {
        margin: 22px 0 10px;
        font-size: 34px;
        letter-spacing: -1.2px;
      }
      h1 span {
        background: linear-gradient(135deg, #ff4db8, #8f66ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 0 auto 22px;
        max-width: 340px;
        color: #c9c5d6;
        line-height: 1.55;
      }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        border-radius: 16px;
        background: #fff;
        color: #11131c;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.svg" alt="">
      <h1>Perk<span>Drop</span></h1>
      <p>Connect to the internet to load the latest local deals, events and places worth knowing about.</p>
      <a href="https://perkdrop.au">Retry PerkDrop</a>
    </main>
  </body>
</html>
