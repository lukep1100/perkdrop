name: Prepare native release dependencies

on:
  push:
    branches: [feature/native-app]
    paths: ['.github/workflows/mobile-dependency-setup.yml']

permissions:
  contents: write

concurrency:
  group: native-release-dependencies
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'lukep1100/perkdrop' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the existing locked dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Resolve only SDK-compatible notification and public-cache packages
        working-directory: mobile
        run: |
          NOTIFICATIONS=$(node -p "require('./node_modules/expo/bundledNativeModules.json')['expo-notifications']")
          FILESYSTEM=$(node -p "require('./node_modules/expo/bundledNativeModules.json')['expo-file-system']")
          test "$NOTIFICATIONS" != undefined
          test "$FILESYSTEM" != undefined
          npm install --save-exact --no-audit --no-fund "expo-notifications@$NOTIFICATIONS" "expo-file-system@$FILESYSTEM"
          node -e "const p=require('./package.json'); console.log(JSON.stringify({notifications:p.dependencies['expo-notifications'],fileSystem:p.dependencies['expo-file-system']}))"
      - name: Check compatibility before committing the generated lockfile
        working-directory: mobile
        run: npx expo-doctor@latest
      - name: Commit only package metadata to the existing draft app branch
        run: |
          if git diff --quiet -- mobile/package.json mobile/package-lock.json; then
            echo 'Dependency metadata is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/package.json mobile/package-lock.json
          git commit -m 'Lock SDK-compatible notification and public catalogue cache dependencies'
          git push origin HEAD:refs/heads/feature/native-app
